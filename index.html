<title>Mohammad Mkia — Programmer</title>
<meta name="description" content="Mohammad Mkia — Programmer">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:#0a0a0a; color:#f5f5f3; font-family:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x:hidden; }
  .serif{ font-family:"Bodoni Moda", Georgia, "Times New Roman", serif; font-optical-sizing:auto; }
  #glow{ position:fixed; width:520px; height:520px; left:0; top:0; pointer-events:none; z-index:0; border-radius:50%; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.09), transparent 60%); transform:translate(-50%,-50%); }
  @media (hover:none), (max-width:768px){ #glow{ display:none; } }
  #intro{ position:fixed; inset:0; z-index:50; background:#000; color:#fff; display:flex; align-items:center; justify-content:center; animation:introOut .8s ease 1.3s forwards; }
  #intro span{ font-size:clamp(40px,8vw,90px); letter-spacing:.08em; animation:introIn 1s ease both; }
  @keyframes introOut{ to{ opacity:0; visibility:hidden; } }
  @keyframes introIn{ from{ opacity:0; transform:translateY(24px); } to{ opacity:1; transform:none; } }
  header{ position:relative; z-index:1; padding:clamp(18px,4vw,28px) clamp(20px,6vw,72px); }
  header span{ font-size:clamp(18px,3vw,22px); letter-spacing:.06em; transition:letter-spacing .4s; cursor:default; }
  header span:hover{ letter-spacing:.18em; }
  main{ position:relative; z-index:1; min-height:88vh; min-height:88svh; display:flex; flex-direction:column; justify-content:center;
    padding:2vh clamp(20px,6vw,72px) 8vh; max-width:1150px; width:100%; }
  h1{ font-size:clamp(46px, 12vw, 138px); line-height:.92; margin:0; font-weight:400; letter-spacing:-.01em; }
  h1 .letter{ display:inline-block; opacity:0; animation:letterIn .8s cubic-bezier(.2,.8,.2,1) forwards; transition:transform .3s, color .3s; cursor:default; }
  h1 .letter.done{ animation:none; opacity:1; }
  h1 .letter.done:hover{ transform:translateY(-10px) rotate(-2deg); color:#c8c8c6; }
  @keyframes letterIn{ from{ opacity:0; transform:translateY(60px); } to{ opacity:1; transform:none; } }
  .ribbon-band{ height:clamp(110px, 22vw, 200px); overflow:hidden; margin:clamp(6px,2vw,10px) 0 0; perspective:900px; will-change:transform; }
  .ribbon-band img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; mix-blend-mode:screen;
    animation:ribbonFlow 7s ease-in-out infinite; will-change:transform; }
  @keyframes ribbonFlow{ 0%,100%{ transform:scale(1.02) translateX(0); } 50%{ transform:scale(1.06) translateX(10px); } }
  p.lead{ font-size:clamp(15px, 2.4vw, 22px); color:#d0d0ce; margin:clamp(20px,4vw,28px) 0 0; animation:fadeUp .9s ease 2.2s both; }
  p.lead .cursor{ display:inline-block; width:.55em; height:1em; background:#f5f5f3; margin-left:4px; vertical-align:-0.1em; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:none; } }
  .links{ display:flex; flex-wrap:wrap; gap:14px; margin-top:clamp(24px,5vw,36px); animation:fadeUp .9s ease 2.4s both; }
  .links a{ background:#fff; color:#000; text-decoration:none; padding:14px 22px; border-radius:999px; font-size:clamp(13px,2vw,15px); font-weight:500;
    position:relative; overflow:hidden; transition:transform .25s; white-space:nowrap; }
  .links a:hover{ transform:translateY(-3px); }
  .links a::after{ content:""; position:absolute; top:0; left:-80%; width:50%; height:100%; background:linear-gradient(100deg, transparent, rgba(0,0,0,.18), transparent); transform:skewX(-20deg); transition:left .6s; }
  .links a:hover::after{ left:130%; }
  footer{ position:relative; z-index:1; padding:28px clamp(20px,6vw,72px) 40px; color:#888; font-size:12px; letter-spacing:.08em; border-top:1px solid #222; }
  @media (max-width:768px){ main{ min-height:82vh; min-height:82svh; } h1{ line-height:.95; } }
  @media (max-width:560px){
    .links{ flex-direction:column; }
    .links a{ width:100%; text-align:center; padding:15px 18px; }
    .ribbon-band{ height:130px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>

<script>
  // Intro fallback: never block the page if CSS animation is interrupted
  setTimeout(() => { const i = document.getElementById('intro'); if (i) i.style.display = 'none'; }, 2600);

  // Letters: after the entrance animation ends, remove the animation so :hover works.
  // Before this fix, animation-fill-mode:forwards overrode hover transforms.
  document.querySelectorAll('.letter').forEach(el => {
    el.addEventListener('animationend', () => { el.classList.add('done'); });
  });

  const glow = document.getElementById('glow');
  const band = document.getElementById('ribbonBand');
  const fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if (fine) {
    let glowShown = false;
    document.addEventListener('mousemove', (e) => {
      if (!glowShown) { glow.style.opacity = '1'; glowShown = true; }
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });
    // Tilt the wrapper, not the img: the img has its own flow animation,
    // which overrode JS transforms on the img itself before this fix.
    band.addEventListener('mousemove', (e) => {
      const r = band.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      band.style.transform = 'perspective(900px) rotateY(' + (x * 6) + 'deg) rotateX(' + (-y * 6) + 'deg)';
    });
    band.addEventListener('mouseleave', () => { band.style.transform = ''; });
    document.querySelectorAll('.magnet').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const r = btn.getBoundingClientRect();
        btn.style.transform = 'translate(' + ((e.clientX - r.left - r.width/2) * 0.18) + 'px,' + ((e.clientY - r.top - r.height/2) * 0.3 - 3) + 'px)';
      });
      btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
    });
  }
  const hero = document.getElementById('hero');
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      hero.style.transform = 'translateY(' + (y * 0.08) + 'px)';
      hero.style.opacity = Math.max(0.4, 1 - y / 900);
      ticking = false;
    });
  }, { passive: true });
</script>
</body>
</html>
